<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Auto Typer</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-256.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="title-group">
        <h1>Auto Typer</h1>
        <span id="phase" class="badge">Ready</span>
        <span id="version" class="version">1.0.0</span>
      </div>
      <button id="open-settings" class="ghost" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 13a7.8 7.8 0 0 0 .1-2l2-1.2-2-3.4-2.3.6a8 8 0 0 0-1.7-1L15 3h-4l-.5 2.9a8 8 0 0 0-1.7 1L6.5 6.4l-2 3.4L6.5 11a7.8 7.8 0 0 0 .1 2l-2 1.2 2 3.4 2.3-.6a8 8 0 0 0 1.7 1L11 21h4l.5-2.9a8 8 0 0 0 1.7-1l2.3.6 2-3.4-2-1.3Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        Settings
      </button>
    </header>

    <section class="editor">
      <div class="sheet">
        <div id="highlight" class="highlight" aria-hidden="true"></div>
        <textarea id="text" spellcheck="false" placeholder="" aria-label="Text to type"></textarea>
      </div>
      <div id="count-overlay" class="count-overlay" hidden>1</div>
      <div id="pause-mark" class="pause-mark" hidden aria-hidden="true"><span></span><span></span></div>
      <div id="focus-pause" class="focus-pause" hidden aria-hidden="true"><span></span><span></span></div>
      <div class="rail" aria-hidden="true"></div>
      <div class="count" id="count">0/0</div>
      <div class="progress" aria-hidden="true"><span id="bar"></span></div>
    </section>

    <section class="controls">
      <button id="play" class="play" type="button" aria-label="Start">
        <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5-11-6.5Z"/></svg>
        <svg id="pause-icon" class="is-hidden" viewBox="0 0 24 24"><path d="M7 5h3.2v14H7V5Zm6.8 0H17v14h-3.2V5Z"/></svg>
      </button>
      <button id="reset" class="power" type="button" aria-label="Reset">
        <svg viewBox="0 0 24 24"><path d="M12 3.5v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M7.1 6.2a7 7 0 1 0 9.8 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <span class="speed-label">Speed</span>
      <input id="speed" type="range" min="1" max="30" value="4" aria-label="Speed">
      <span id="speed-box" class="speed-box">4</span>
      <span class="unit">chars/sec</span>
    </section>

    <footer class="footer">
      <label class="switch">
        <input id="on-top" type="checkbox">
        <span class="knob"></span>
        Always on top
      </label>
      <span class="shortcuts" id="shortcuts">Ctrl+Up Start / Pause &nbsp;&nbsp; Ctrl+Down Reset</span>
    </footer>
  </div>

  <dialog id="settings">
    <form id="settings-form" method="dialog">
      <header class="dialog-top">
        <div class="brand">
          <span class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="#fff" stroke-width="1.7"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>
          </span>
          <h2>Settings</h2>
        </div>
        <button id="close-settings" class="icon-x" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="rows">
        <label class="row">
          <span><strong>Start delay</strong><small>Only 1, 2, or 3 seconds</small></span>
          <input id="start-delay" inputmode="numeric" value="1">
        </label>
        <label class="row">
          <span><strong>Default speed</strong><small>A number from 1 to 30</small></span>
          <input id="default-speed" inputmode="numeric" value="4">
        </label>
        <label class="row">
          <span><strong>Mistake frequency</strong><small>A number from 0 to 10. 0 turns mistakes off</small></span>
          <input id="mistake-frequency" inputmode="numeric" value="2">
        </label>
        <label class="row">
          <span><strong>Mistake length</strong><small>A number from 0 to 5</small></span>
          <input id="mistake-length" inputmode="numeric" value="3">
        </label>
        <label class="row">
          <span><strong>Start / Pause hotkey</strong><small>Click, then press a shortcut like Ctrl+Up</small></span>
          <input id="start-hotkey" class="hotkey" value="Ctrl+Up" readonly>
        </label>
        <label class="row">
          <span><strong>Reset hotkey</strong><small>Click, then press a shortcut like Ctrl+Down</small></span>
          <input id="reset-hotkey" class="hotkey" value="Ctrl+Down" readonly>
        </label>
      </div>
      <p id="settings-error" class="error" role="status"></p>
      <footer class="dialog-actions">
        <button id="cancel-settings" class="ghost" type="button" value="cancel">Cancel</button>
        <button id="save-settings" class="save" type="submit" value="save">Save</button>
      </footer>
    </form>
  </dialog>
  <div id="edit-menu" class="edit-menu" hidden>
    <button type="button" data-edit="cut">Cut</button>
    <button type="button" data-edit="copy">Copy</button>
    <button type="button" data-edit="paste">Paste</button>
    <button type="button" data-edit="selectAll">Select all</button>
  </div>
  <script src="/app.js"></script>
</body>
</html>
